name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: [bug]

body:
  - type: input
    id: os
    attributes:
      label: OS / Distro
      placeholder: e.g. Arch Linux, Ubuntu 24.04, Fedora 41
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel Version
      placeholder: e.g. 6.6.10-arch1-1
    validations:
      required: true

  - type: input
    id: de
    attributes:
      label: Desktop Environment & Version
      placeholder: e.g. GNOME 46, KDE Plasma 6.0, XFCE 4.18
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Issue Description
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What you expected to happen.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      placeholder: Any other context, logs, or screenshots.
